server {
    listen 80;
    listen [::]:80;
    server_name flow.ciyufish.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/enterprise-cases-acme;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name flow.ciyufish.cn;
    ssl_certificate /etc/enterprise-cases/acme/live/flow.ciyufish.cn/fullchain.pem;
    ssl_certificate_key /etc/enterprise-cases/acme/live/flow.ciyufish.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EnterpriseCasesTLS:1m;

    access_log /var/log/nginx/enterprise-cases.access.log;
    error_log /var/log/nginx/enterprise-cases.error.log;

    location ^~ /reference/covers/ {
        alias /var/lib/enterprise-cases/covers/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:12091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
