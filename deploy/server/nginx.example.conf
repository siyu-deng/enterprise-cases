# Example only; set the actual domain and TLS certificate before enabling.
server {
    listen 80;
    server_name cases.example.com;

    # Persistent covers are served by Nginx, including files added after Next.js starts.
    location ^~ /reference/covers/ {
        alias /var/lib/enterprise-cases/covers/;
        autoindex off;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://127.0.0.1:12091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
